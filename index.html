<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>JLPT N4 단어·문장 학습</title>
<style>
/* ===== Design tokens (synced from design-system/tokens.css) ===== */
:root{
  --background:0 0% 100%;
  --foreground:0 0% 3.9%;
  --card:0 0% 100%;
  --card-foreground:0 0% 3.9%;
  --primary:0 0% 9%;
  --primary-foreground:0 0% 98%;
  --secondary:0 0% 96.1%;
  --secondary-foreground:0 0% 3.9%;
  --muted:0 0% 96.1%;
  --muted-foreground:0 0% 45.1%;
  --accent:0 0% 96.1%;
  --accent-foreground:0 0% 9%;
  --destructive:0 72.2% 50.6%;
  --destructive-foreground:0 0% 98%;
  --border:0 0% 89.8%;
  --input:0 0% 89.8%;
  --ring:0 0% 45.1%;
  --sidebar:0 0% 98%;
  --sidebar-foreground:0 0% 3.9%;
  --sidebar-primary:0 0% 9%;
  --sidebar-primary-foreground:0 0% 98%;
  --sidebar-accent:0 0% 96.1%;
  --sidebar-accent-foreground:0 0% 9%;
  --sidebar-border:0 0% 89.8%;

  --radius-xs:2px; --radius-sm:6px; --radius-md:8px; --radius-lg:10px;
  --radius-xl:14px; --radius-full:9999px;
  --radius:var(--radius-md);

  --space-1:4px; --space-2:8px; --space-3:12px; --space-4:16px;
  --space-5:20px; --space-6:24px; --space-8:32px; --space-10:40px;
  --space-12:48px;

  --font-sans:ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,"Pretendard","Apple SD Gothic Neo",sans-serif;
  --text-xs:12px; --text-sm:14px; --text-base:16px; --text-lg:18px;
  --text-xl:20px; --text-2xl:24px; --text-3xl:30px;
  --leading-normal:1.5; --leading-relaxed:1.625;
  --font-medium:500; --font-semibold:600; --font-bold:700;

  --shadow-sm:0 1px 2px 0 rgb(0 0 0 / .05);
  --shadow:0 1px 3px 0 rgb(0 0 0 / .1),0 1px 2px -1px rgb(0 0 0 / .1);
}
.dark{
  --background:0 0% 3.9%;
  --foreground:0 0% 98%;
  --card:0 0% 9%;
  --card-foreground:0 0% 98%;
  --primary:0 0% 89.8%;
  --primary-foreground:0 0% 9%;
  --secondary:0 0% 14.9%;
  --secondary-foreground:0 0% 98%;
  --muted:0 0% 14.9%;
  --muted-foreground:0 0% 63.9%;
  --accent:0 0% 25.1%;
  --accent-foreground:0 0% 98%;
  --border:0 0% 25.1%;
  --input:0 0% 9%;
  --sidebar:0 0% 9%;
  --sidebar-foreground:0 0% 98%;
  --sidebar-primary:207 95.9% 48%;
  --sidebar-primary-foreground:0 0% 98%;
  --sidebar-accent:0 0% 14.9%;
  --sidebar-accent-foreground:0 0% 98%;
  --sidebar-border:0 0% 25.1%;
}

*,*::before,*::after{box-sizing:border-box}
html{font-family:var(--font-sans);font-size:16px;line-height:var(--leading-normal);-webkit-font-smoothing:antialiased}
body{margin:0;background-color:hsl(var(--background));color:hsl(var(--foreground));font-size:var(--text-sm)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid hsl(var(--ring));outline-offset:2px}

/* ===== Layout ===== */
.app{min-height:100vh;display:flex;flex-direction:column}
.nav-top{
  height:3.5rem;display:flex;align-items:center;gap:var(--space-4);
  padding:0 var(--space-6);border-bottom:1px solid hsl(var(--border));
  background:hsl(var(--background));position:sticky;top:0;z-index:10;
}
.brand{display:flex;align-items:center;gap:var(--space-2);font-weight:var(--font-semibold);font-size:var(--text-base)}
.brand-mark{
  width:1.75rem;height:1.75rem;display:grid;place-items:center;
  background:hsl(var(--primary));color:hsl(var(--primary-foreground));
  border-radius:var(--radius-sm);font-size:var(--text-sm);font-weight:var(--font-bold);
}
.tabs{display:flex;gap:var(--space-1);margin-left:var(--space-6)}
.tab{
  padding:var(--space-2) var(--space-3);
  border-radius:var(--radius-sm);
  color:hsl(var(--muted-foreground));text-decoration:none;
  font-size:var(--text-sm);font-weight:var(--font-medium);
  background:transparent;border:0;cursor:pointer;
}
.tab:hover{background:hsl(var(--accent));color:hsl(var(--accent-foreground))}
.tab.is-active{background:hsl(var(--secondary));color:hsl(var(--secondary-foreground))}
.nav-spacer{flex:1}
.nav-actions{display:flex;align-items:center;gap:var(--space-2)}

.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:var(--space-2);
  height:2.25rem;padding:0 var(--space-3);
  border-radius:var(--radius-sm);font-size:var(--text-sm);font-weight:var(--font-medium);
  border:1px solid transparent;cursor:pointer;
  transition:background-color .15s,border-color .15s,color .15s;
  white-space:nowrap;
}
.btn-primary{background:hsl(var(--primary));color:hsl(var(--primary-foreground))}
.btn-primary:hover{opacity:.9}
.btn-outline{background:transparent;border-color:hsl(var(--border));color:hsl(var(--foreground))}
.btn-outline:hover{background:hsl(var(--accent));color:hsl(var(--accent-foreground))}
.btn-ghost{background:transparent;color:hsl(var(--foreground))}
.btn-ghost:hover{background:hsl(var(--accent));color:hsl(var(--accent-foreground))}
.btn-sm{height:2rem;padding:0 var(--space-2);font-size:var(--text-xs)}

.icon{width:1rem;height:1rem;flex:none}

/* ===== Page ===== */
.page{flex:1;display:flex;width:100%;max-width:1280px;margin:0 auto}
.sidebar{
  width:18rem;flex:none;
  background:hsl(var(--sidebar));color:hsl(var(--sidebar-foreground));
  border-right:1px solid hsl(var(--sidebar-border));
  padding:var(--space-6);
  position:sticky;top:3.5rem;align-self:flex-start;
  max-height:calc(100vh - 3.5rem);overflow-y:auto;
}
.sidebar-section + .sidebar-section{margin-top:var(--space-6)}
.sidebar-heading{
  font-size:var(--text-xs);font-weight:var(--font-semibold);
  color:hsl(var(--muted-foreground));text-transform:uppercase;
  letter-spacing:.04em;margin:0 0 var(--space-3) 0;
}
.tag-list{display:flex;flex-wrap:wrap;gap:var(--space-2)}
.tag{
  display:inline-flex;align-items:center;gap:var(--space-1);
  padding:var(--space-1) var(--space-3);
  border-radius:var(--radius-full);
  font-size:var(--text-xs);font-weight:var(--font-medium);
  background:transparent;color:hsl(var(--sidebar-foreground));
  border:1px solid hsl(var(--sidebar-border));
  cursor:pointer;line-height:1.3;
}
.tag:hover{background:hsl(var(--sidebar-accent));color:hsl(var(--sidebar-accent-foreground))}
.tag.is-on{
  background:hsl(var(--sidebar-primary));
  color:hsl(var(--sidebar-primary-foreground));
  border-color:hsl(var(--sidebar-primary));
}
.tag-count{
  font-size:10px;opacity:.6;font-weight:var(--font-medium);
  margin-left:var(--space-1);
}

.content{flex:1;padding:var(--space-6) var(--space-8);min-width:0}
.content-header{
  display:flex;align-items:flex-start;justify-content:space-between;gap:var(--space-4);
  margin-bottom:var(--space-6);flex-wrap:wrap;
}
.content-title{font-size:var(--text-2xl);font-weight:var(--font-semibold);margin:0}
.content-sub{font-size:var(--text-sm);color:hsl(var(--muted-foreground));margin-top:var(--space-1)}
.content-actions{display:flex;align-items:center;gap:var(--space-2);flex-wrap:wrap}

.input{
  height:2.25rem;padding:0 var(--space-3);
  border:1px solid hsl(var(--input));border-radius:var(--radius-sm);
  background:hsl(var(--background));color:hsl(var(--foreground));
  font-size:var(--text-sm);width:100%;
}
.input::placeholder{color:hsl(var(--muted-foreground))}
.search{position:relative;width:18rem;max-width:100%}
.search .input{padding-left:2.25rem}
.search .icon{position:absolute;top:50%;left:.75rem;transform:translateY(-50%);color:hsl(var(--muted-foreground))}

.toggle{
  display:inline-flex;align-items:center;gap:var(--space-2);
  font-size:var(--text-sm);color:hsl(var(--foreground));cursor:pointer;
  user-select:none;
}
.toggle input{appearance:none;width:2.25rem;height:1.25rem;background:hsl(var(--muted));border-radius:var(--radius-full);position:relative;cursor:pointer;border:1px solid hsl(var(--border));transition:background .15s}
.toggle input::after{content:"";position:absolute;top:1px;left:1px;width:1rem;height:1rem;background:hsl(var(--background));border-radius:var(--radius-full);transition:left .15s;box-shadow:var(--shadow-sm)}
.toggle input:checked{background:hsl(var(--primary));border-color:hsl(var(--primary))}
.toggle input:checked::after{left:1.05rem;background:hsl(var(--primary-foreground))}

.summary{
  display:flex;align-items:center;gap:var(--space-3);
  margin-bottom:var(--space-4);
  font-size:var(--text-sm);color:hsl(var(--muted-foreground));
  flex-wrap:wrap;
}
.summary-pill{
  padding:var(--space-1) var(--space-3);
  background:hsl(var(--secondary));color:hsl(var(--secondary-foreground));
  border-radius:var(--radius-full);font-weight:var(--font-medium);
  display:inline-flex;align-items:center;gap:var(--space-1);
}
.summary-pill button{
  background:transparent;border:0;color:inherit;cursor:pointer;padding:0;line-height:1;
  font-size:var(--text-sm);
}
.summary-pill button:hover{opacity:.6}

/* ===== Cards ===== */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:var(--space-4)}
.card{
  background:hsl(var(--card));color:hsl(var(--card-foreground));
  border:1px solid hsl(var(--border));border-radius:var(--radius);
  padding:var(--space-5);
  display:flex;flex-direction:column;gap:var(--space-3);
  transition:border-color .15s, box-shadow .15s;
}
.card:hover{border-color:hsl(var(--ring));box-shadow:var(--shadow-sm)}
.card-row{display:flex;align-items:baseline;justify-content:space-between;gap:var(--space-3)}
.word{font-size:var(--text-2xl);font-weight:var(--font-semibold);line-height:1.2;font-feature-settings:"palt"}
.word ruby{ruby-position:over}
.word rt{font-size:.55em;font-weight:var(--font-medium);color:hsl(var(--muted-foreground));letter-spacing:.02em}
.reading{font-size:var(--text-sm);color:hsl(var(--muted-foreground))}
.meaning{font-size:var(--text-base);font-weight:var(--font-medium);margin:0}
.example{
  margin:0;padding:var(--space-3) var(--space-4);
  background:hsl(var(--muted));border-radius:var(--radius-sm);
  font-size:var(--text-sm);color:hsl(var(--foreground));line-height:var(--leading-relaxed);
}
.example .ko{display:block;margin-top:var(--space-1);color:hsl(var(--muted-foreground));font-size:var(--text-xs)}
.tags{display:flex;flex-wrap:wrap;gap:var(--space-1)}
.tag-mini{
  display:inline-flex;align-items:center;
  padding:2px var(--space-2);
  border-radius:var(--radius-full);
  font-size:11px;font-weight:var(--font-medium);
  background:hsl(var(--secondary));color:hsl(var(--secondary-foreground));
  border:1px solid transparent;
}
.tag-mini.pos{background:hsl(var(--accent));color:hsl(var(--accent-foreground))}

/* ===== Sentence list ===== */
.sentence-list{display:flex;flex-direction:column;gap:var(--space-3)}
.s-card{
  background:hsl(var(--card));border:1px solid hsl(var(--border));
  border-radius:var(--radius);padding:var(--space-5);
  display:flex;flex-direction:column;gap:var(--space-2);
}
.s-num{
  display:inline-flex;align-items:center;justify-content:center;
  min-width:2rem;height:1.5rem;padding:0 var(--space-2);
  border-radius:var(--radius-full);
  background:hsl(var(--secondary));color:hsl(var(--secondary-foreground));
  font-size:var(--text-xs);font-weight:var(--font-semibold);
  width:max-content;
}
.s-jp{font-size:var(--text-lg);line-height:var(--leading-relaxed);font-feature-settings:"palt"}
.s-jp ruby rt{font-size:.5em;color:hsl(var(--muted-foreground));font-weight:var(--font-medium)}
.s-ko{font-size:var(--text-sm);color:hsl(var(--muted-foreground));margin-top:var(--space-1)}
.s-meta{display:flex;justify-content:space-between;align-items:center;gap:var(--space-2);margin-top:var(--space-1)}

/* ===== Empty / footer ===== */
.empty{
  text-align:center;padding:var(--space-12) var(--space-6);
  color:hsl(var(--muted-foreground));
  border:1px dashed hsl(var(--border));border-radius:var(--radius);
}
.empty-title{font-size:var(--text-base);font-weight:var(--font-medium);color:hsl(var(--foreground));margin:0 0 var(--space-2)}

.hidden{display:none !important}

/* ===== Responsive ===== */
@media (max-width: 880px){
  .page{flex-direction:column}
  .sidebar{
    width:100%;position:static;max-height:none;
    border-right:0;border-bottom:1px solid hsl(var(--sidebar-border));
  }
  .content{padding:var(--space-4)}
  .nav-top{padding:0 var(--space-4)}
  .tabs{margin-left:var(--space-2)}
}
</style>
</head>
<body>
<div class="app">
  <header class="nav-top">
    <div class="brand">
      <span class="brand-mark">N4</span>
      <span>JLPT N4 학습</span>
    </div>
    <nav class="tabs" role="tablist">
      <button class="tab is-active" data-view="vocab" role="tab">단어장</button>
      <button class="tab" data-view="sentence" role="tab">문장 모음</button>
    </nav>
    <div class="nav-spacer"></div>
    <div class="nav-actions">
      <button class="btn btn-ghost btn-sm" id="themeToggle" title="테마 전환">
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
        <span id="themeLabel">다크</span>
      </button>
    </div>
  </header>

  <!-- ============ Vocab view ============ -->
  <main class="page" id="view-vocab">
    <aside class="sidebar">
      <div class="sidebar-section">
        <h3 class="sidebar-heading">품사</h3>
        <div class="tag-list" id="tagList-pos"></div>
      </div>
      <div class="sidebar-section">
        <h3 class="sidebar-heading">주제 카테고리</h3>
        <div class="tag-list" id="tagList-topic"></div>
      </div>
    </aside>
    <section class="content">
      <header class="content-header">
        <div>
          <h1 class="content-title">N4 단어장</h1>
          <p class="content-sub">총 <strong id="vTotal">0</strong>개 · 한자 위에 마우스를 올리면 후리가나가 보입니다</p>
        </div>
        <div class="content-actions">
          <div class="search">
            <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
            <input class="input" id="vSearch" type="text" placeholder="단어 / 읽기 / 뜻 검색…" />
          </div>
          <label class="toggle">
            <input type="checkbox" id="vShowExample" checked />
            예문 표시
          </label>
          <label class="toggle">
            <input type="checkbox" id="vShowFurigana" checked />
            후리가나
          </label>
        </div>
      </header>
      <div class="summary" id="vSummary"></div>
      <div class="grid" id="vocabGrid"></div>
      <div class="empty hidden" id="vEmpty">
        <p class="empty-title">조건에 맞는 단어가 없습니다.</p>
        <p>검색어를 바꾸거나 태그를 다시 선택해 보세요.</p>
      </div>
    </section>
  </main>

  <!-- ============ Sentence view ============ -->
  <main class="page hidden" id="view-sentence">
    <aside class="sidebar">
      <div class="sidebar-section">
        <h3 class="sidebar-heading">표시 옵션</h3>
        <div style="display:flex;flex-direction:column;gap:var(--space-3)">
          <label class="toggle">
            <input type="checkbox" id="sShowFurigana" checked />
            후리가나 표시
          </label>
          <label class="toggle">
            <input type="checkbox" id="sShowKo" checked />
            한국어 뜻 표시
          </label>
        </div>
      </div>
      <div class="sidebar-section">
        <h3 class="sidebar-heading">표시 개수</h3>
        <div class="tag-list" id="sCountList"></div>
      </div>
    </aside>
    <section class="content">
      <header class="content-header">
        <div>
          <h1 class="content-title">N4 문장 모음</h1>
          <p class="content-sub">랜덤 셔플로 뽑힌 문장 · 매번 새로운 순서로 학습하세요</p>
        </div>
        <div class="content-actions">
          <button class="btn btn-primary" id="sShuffle">
            <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 3h5v5"/><path d="M4 20 21 3"/><path d="M21 16v5h-5"/><path d="M15 15l6 6"/><path d="M4 4l5 5"/></svg>
            다시 섞기
          </button>
        </div>
      </header>
      <div class="summary" id="sSummary"></div>
      <div class="sentence-list" id="sentenceList"></div>
    </section>
  </main>

)の冬(ふゆ)はいつもより寒(さむ)いと天気予報(てんきよほう)で言(い)っていました。","ko":"올해 겨울은 평소보다 춥다고 날씨 예보에서 말했습니다.","category":"건강·날씨·자연"},{"jp":"昨日の地震は大きかったですが、怪我人はいませんでした。","jpAnno":"昨日(きのう)の地震(じしん)は大(おお)きかったですが、怪我人(けがにん)はいませんでした。","ko":"어제 지진은 컸지만, 부상자는 없었습니다.","category":"건강·날씨·자연"},{"jp":"花粉症がひどくて、毎年春になるとつらいです。","jpAnno":"花粉症(かふんしょう)がひどくて、毎年(まいとし)春(はる)になるとつらいです。","ko":"꽃가루 알레르기가 심해서, 매년 봄이 되면 힘듭니다.","category":"건강·날씨·자연"},{"jp":"雨が止んだので、散歩に出かけました。","jpAnno":"雨(あめ)が止(や)んだので、散歩(さんぽ)に出(で)かけました。","ko":"비가 그쳐서, 산책하러 나갔습니다.","category":"건강·날씨·자연"},{"jp":"この辺は自然が豊かで、空気がきれいです。","jpAnno":"この辺(へん)は自然(しぜん)が豊(ゆた)かで、空気(くうき)がきれいです。","ko":"이 근처는 자연이 풍부하고, 공기가 깨끗합니다.","category":"건강·날씨·자연"},{"jp":"梅雨の時期は、毎日曇りか雨です。","jpAnno":"梅雨(つゆ)の時期(じき)は、毎日(まいにち)曇(くも)りか雨(あめ)です。","ko":"장마철은, 매일 흐리거나 비입니다.","category":"건강·날씨·자연"},{"jp":"冬に備えて、暖かい服を用意しました。","jpAnno":"冬(ふゆ)に備(そな)えて、暖(あたた)かい服(ふく)を用意(ようい)しました。","ko":"겨울에 대비해서, 따뜻한 옷을 준비했습니다.","category":"건강·날씨·자연"},{"jp":"川で子どもたちが魚を捕まえて遊んでいます。","jpAnno":"川(かわ)で子(こ)どもたちが魚(さかな)を捕(つか)まえて遊(あそ)んでいます。","ko":"강에서 아이들이 물고기를 잡으며 놀고 있습니다.","category":"건강·날씨·자연"},{"jp":"風が強くて、傘が壊れてしまいました。","jpAnno":"風(かぜ)が強(つよ)くて、傘(かさ)が壊(こわ)れてしまいました。","ko":"바람이 강해서, 우산이 망가져 버렸습니다.","category":"건강·날씨·자연"},{"jp":"体の具合が悪い時は、無理をしないでください。","jpAnno":"体(からだ)の具合(ぐあい)が悪(わる)い時(とき)は、無理(むり)をしないでください。","ko":"몸 상태가 나쁠 때는, 무리하지 마세요.","category":"건강·날씨·자연"},{"jp":"よく眠れないと、翌日の仕事に影響が出ます。","jpAnno":"よく眠(ねむ)れないと、翌日(よくじつ)の仕事(しごと)に影響(えいきょう)が出(で)ます。","ko":"잘 자지 못하면, 다음 날 일에 영향이 나옵니다.","category":"건강·날씨·자연"},{"jp":"夏は蚊が多くて、虫よけスプレーが必要です。","jpAnno":"夏(なつ)は蚊(か)が多(おお)くて、虫(むし)よけスプレーが必要(ひつよう)です。","ko":"여름은 모기가 많아서, 모기 기피제가 필요합니다.","category":"건강·날씨·자연"},{"jp":"ストレスがたまって体調が崩れたので、医者に診てもらいました。","jpAnno":"ストレスがたまって体調(たいちょう)が崩(くず)れたので、医者(いしゃ)に診(み)てもらいました。","ko":"스트레스가 쌓여서 건강이 나빠져서, 의사에게 진찰받았습니다.","category":"건강·날씨·자연"},{"jp":"毎日バランスのいい食事をすることが健康の基本です。","jpAnno":"毎日(まいにち)バランスのいい食事(しょくじ)をすることが健康(けんこう)の基本(きほん)です。","ko":"매일 균형 잡힌 식사를 하는 것이 건강의 기본입니다.","category":"건강·날씨·자연"},{"jp":"寒い日は温かいスープを飲みたくなります。","jpAnno":"寒(さむ)い日(ひ)は温(あたた)かいスープを飲(の)みたくなります。","ko":"추운 날은 따뜻한 수프를 마시고 싶어집니다.","category":"건강·날씨·자연"},{"jp":"日焼けしないように、日焼け止めを塗りました。","jpAnno":"日(ひ)焼(や)けしないように、日焼(ひや)け止(ど)めを塗(ぬ)りました。","ko":"햇볕에 타지 않도록, 자외선 차단제를 발랐습니다.","category":"건강·날씨·자연"},{"jp":"このハーブティーは体にいいので、毎晩飲んでいます。","jpAnno":"このハーブティーは体(からだ)にいいので、毎晩(まいばん)飲(の)んでいます。","ko":"이 허브티는 몸에 좋아서, 매일 밤 마시고 있습니다.","category":"건강·날씨·자연"},{"jp":"退院してからも、定期的に病院に来るように言われました。","jpAnno":"退院(たいいん)してからも、定期的(ていきてき)に病院(びょういん)に来(く)るように言(い)われました。","ko":"퇴원하고 나서도, 정기적으로 병원에 오라고 들었습니다.","category":"건강·날씨·자연"},{"jp":"春の暖かい日差しの中を散歩するのが好きです。","jpAnno":"春(はる)の暖(あたた)かい日差(ひざ)しの中(なか)を散歩(さんぽ)するのが好(す)きです。","ko":"봄의 따뜻한 햇살 속을 산책하는 것을 좋아합니다.","category":"건강·날씨·자연"},{"jp":"雨の日は気分が落ち込みやすいです。","jpAnno":"雨(あめ)の日(ひ)は気分(きぶん)が落(お)ち込(こ)みやすいです。","ko":"비 오는 날은 기분이 가라앉기 쉽습니다.","category":"건강·날씨·자연"},{"jp":"台風の後は道に木の枝が落ちていました。","jpAnno":"台風(たいふう)の後(あと)は道(みち)に木(き)の枝(えだ)が落(お)ちていました。","ko":"태풍 후에는 길에 나뭇가지가 떨어져 있었습니다.","category":"건강·날씨·자연"},{"jp":"山の上から見る景色はとても美しかったです。","jpAnno":"山(やま)の上(うえ)から見(み)る景色(けしき)はとても美(うつく)しかったです。","ko":"산 위에서 보는 경치는 매우 아름다웠습니다.","category":"건강·날씨·자연"},{"jp":"急に寒くなったので、風邪をひく人が増えました。","jpAnno":"急(きゅう)に寒(さむ)くなったので、風邪(かぜ)をひく人(ひと)が増(ふ)えました。","ko":"갑자기 추워져서, 감기에 걸리는 사람이 늘었습니다.","category":"건강·날씨·자연"},{"jp":"冬の朝は布団から出るのがつらいです。","jpAnno":"冬(ふゆ)の朝(あさ)は布団(ふとん)から出(で)るのがつらいです。","ko":"겨울 아침은 이불에서 나오는 것이 힘듭니다.","category":"건강·날씨·자연"},{"jp":"熱が下がったので、明日から学校に行けそうです。","jpAnno":"熱(ねつ)が下(さ)がったので、明日(あした)から学校(がっこう)に行(い)けそうです。","ko":"열이 내려서, 내일부터 학교에 갈 수 있을 것 같습니다.","category":"건강·날씨·자연"},{"jp":"海で泳いだ後は、シャワーを浴びてください。","jpAnno":"海(うみ)で泳(およ)いだ後(あと)は、シャワーを浴(あ)びてください。","ko":"바다에서 수영한 후에는, 샤워를 하세요.","category":"건강·날씨·자연"},{"jp":"冬になると日が短くなって、夕方5時には暗くなります。","jpAnno":"冬(ふゆ)になると日(ひ)が短(みじか)くなって、夕方(ゆうがた)5時(じ)には暗(くら)くなります。","ko":"겨울이 되면 날이 짧아져서, 저녁 5시에는 어두워집니다.","category":"건강·날씨·자연"},{"jp":"今日は晴れているので、洗濯物がよく乾きます。","jpAnno":"今日(きょう)は晴(は)れているので、洗濯物(せんたくもの)がよく乾(かわ)きます。","ko":"오늘은 맑아서, 빨래가 잘 마릅니다.","category":"건강·날씨·자연"},{"jp":"規則正しい生活をすることが、健康の秘訣です。","jpAnno":"規則(きそく)正(ただ)しい生活(せいかつ)をすることが、健康(けんこう)の秘訣(ひけつ)です。","ko":"규칙적인 생활을 하는 것이, 건강의 비결입니다.","category":"건강·날씨·자연"},{"jp":"今日は空が曇っていて、雨が降りそうです。","jpAnno":"今日(きょう)は空(そら)が曇(くも)っていて、雨(あめ)が降(ふ)りそうです。","ko":"오늘은 하늘이 흐려서, 비가 올 것 같습니다.","category":"건강·날씨·자연"},{"jp":"お腹が痛くて立っていられなかったので、病院に駆け込みました。","jpAnno":"お腹(なか)が痛(いた)くて立(た)っていられなかったので、病院(びょういん)に駆(か)け込(こ)みました。","ko":"배가 아파서 서 있을 수 없었어서, 병원에 달려갔습니다.","category":"건강·날씨·자연"},{"jp":"空気が乾燥しているので、加湿器をつけました。","jpAnno":"空気(くうき)が乾燥(かんそう)しているので、加湿器(かしつき)をつけました。","ko":"공기가 건조해서, 가습기를 켰습니다.","category":"건강·날씨·자연"},{"jp":"疲れているときは無理をせず、しっかり休むことが大切です。","jpAnno":"疲(つか)れているときは無理(むり)をせず、しっかり休(やす)むことが大切(たいせつ)です。","ko":"피곤할 때는 무리하지 말고, 충분히 쉬는 것이 중요합니다.","category":"건강·날씨·자연"},{"jp":"夕方から強い風が吹き始めました。","jpAnno":"夕方(ゆうがた)から強(つよ)い風(かぜ)が吹(ふ)き始(はじ)めました。","ko":"저녁부터 강한 바람이 불기 시작했습니다.","category":"건강·날씨·자연"},{"jp":"健康診断で血圧が高いと言われたので、気をつけています。","jpAnno":"健康診断(けんこうしんだん)で血圧(けつあつ)が高(たか)いと言(い)われたので、気(き)をつけています。","ko":"건강검진에서 혈압이 높다고 해서, 주의하고 있습니다.","category":"건강·날씨·자연"},{"jp":"晴れた日に外でお弁当を食べると、おいしく感じます。","jpAnno":"晴(は)れた日(ひ)に外(そと)でお弁当(べんとう)を食(た)べると、おいしく感(かん)じます。","ko":"맑은 날에 밖에서 도시락을 먹으면, 맛있게 느껴집니다.","category":"건강·날씨·자연"},{"jp":"このサプリメントは体の調子を整えるのに役に立ちます。","jpAnno":"このサプリメントは体(からだ)の調子(ちょうし)を整(ととの)えるのに役(やく)に立(た)ちます。","ko":"이 영양제는 몸 상태를 조절하는 데 도움이 됩니다.","category":"건강·날씨·자연"},{"jp":"森林浴をすると、心も体もリフレッシュできます。","jpAnno":"森林浴(しんりんよく)をすると、心(こころ)も体(からだ)もリフレッシュできます。","ko":"산림욕을 하면, 마음도 몸도 기분 전환할 수 있습니다.","category":"건강·날씨·자연"},{"jp":"先週からずっと雨が続いていて、うんざりしています。","jpAnno":"先週(せんしゅう)からずっと雨(あめ)が続(つづ)いていて、うんざりしています。","ko":"지난주부터 계속 비가 이어지고 있어서, 질려 있습니다.","category":"건강·날씨·자연"},{"jp":"虫に刺されて、腕がかゆくてたまりません。","jpAnno":"虫(むし)に刺(さ)されて、腕(うで)がかゆくてたまりません。","ko":"벌레에 물려서, 팔이 가려워서 견딜 수 없습니다.","category":"건강·날씨·자연"},{"jp":"今年の梅雨は例年より長くなりそうです。","jpAnno":"今年(ことし)の梅雨(つゆ)は例年(れいねん)より長(なが)くなりそうです。","ko":"올해 장마는 예년보다 길어질 것 같습니다.","category":"건강·날씨·자연"},{"jp":"体を冷やさないように、冷たい飲み物を飲みすぎないでください。","jpAnno":"体(からだ)を冷(ひ)やさないように、冷(つめ)たい飲(の)み物(もの)を飲(の)みすぎないでください。","ko":"몸을 식히지 않도록, 차가운 음료를 너무 마시지 마세요.","category":"건강·날씨·자연"},{"jp":"定期的に歯医者に通って、虫歯を予防しています。","jpAnno":"定期的(ていきてき)に歯医者(はいしゃ)に通(かよ)って、虫歯(むしば)を予防(よぼう)しています。","ko":"정기적으로 치과에 다니며, 충치를 예방하고 있습니다.","category":"건강·날씨·자연"},{"jp":"突然の豪雨で、傘を持っていなかったのでびしょ濡れになりました。","jpAnno":"突然(とつぜん)の豪雨(ごうう)で、傘(かさ)を持(も)っていなかったのでびしょ濡(ぬ)れになりました。","ko":"갑작스런 폭우로, 우산이 없었어서 흠뻑 젖었습니다.","category":"건강·날씨·자연"},{"jp":"毎日よく噛んで食べることが、健康につながります。","jpAnno":"毎日(まいにち)よく噛(か)んで食(た)べることが、健康(けんこう)につながります。","ko":"매일 잘 씹어서 먹는 것이, 건강으로 이어집니다.","category":"건강·날씨·자연"},{"jp":"花粉が多い日はマスクをして外に出ます。","jpAnno":"花粉(かふん)が多(おお)い日(ひ)はマスクをして外(そと)に出(で)ます。","ko":"꽃가루가 많은 날은 마스크를 하고 밖에 나갑니다.","category":"건강·날씨·자연"},{"jp":"冬の乾燥した季節は、肌のケアが大切です。","jpAnno":"冬(ふゆ)の乾燥(かんそう)した季節(きせつ)は、肌(はだ)のケアが大切(たいせつ)です。","ko":"겨울의 건조한 계절에는, 피부 케어가 중요합니다.","category":"건강·날씨·자연"},{"jp":"インフルエンザが流行しているので、ワクチンを接種しました。","jpAnno":"インフルエンザが流行(りゅうこう)しているので、ワクチンを接種(せっしゅ)しました。","ko":"독감이 유행하고 있어서, 백신을 접종했습니다.","category":"건강·날씨·자연"},{"jp":"霧が深くて、前がよく見えませんでした。","jpAnno":"霧(きり)が深(ふか)くて、前(まえ)がよく見(み)えませんでした。","ko":"안개가 짙어서, 앞이 잘 보이지 않았습니다.","category":"건강·날씨·자연"},{"jp":"今日は湿度が高くて、洗濯物がなかなか乾きません。","jpAnno":"今日(きょう)は湿度(しつど)が高(たか)くて、洗濯物(せんたくもの)がなかなか乾(かわ)きません。","ko":"오늘은 습도가 높아서, 빨래가 잘 마르지 않습니다.","category":"건강·날씨·자연"},{"jp":"水分をしっかり摂ることで、熱中症を防ぐことができます。","jpAnno":"水分(すいぶん)をしっかり摂(と)ることで、熱中症(ねっちゅうしょう)を防(ふせ)ぐことができます。","ko":"수분을 충분히 섭취함으로써, 열사병을 막을 수 있습니다.","category":"건강·날씨·자연"},{"jp":"この地方は雪が多く、冬は道が凍って危ないです。","jpAnno":"この地方(ちほう)は雪(ゆき)が多(おお)く、冬(ふゆ)は道(みち)が凍(こお)って危(あぶ)ないです。","ko":"이 지방은 눈이 많고, 겨울은 도로가 얼어 위험합니다.","category":"건강·날씨·자연"},{"jp":"山から降りてくるときに足をくじいてしまい、しばらく歩けませんでした。","jpAnno":"山(やま)から降(お)りてくるときに足(あし)をくじいてしまい、しばらく歩(ある)けませんでした。","ko":"산에서 내려올 때 발목을 접질려서, 한동안 걷지 못했습니다.","category":"건강·날씨·자연"},{"jp":"快晴の日に富士山を見ると、とても雄大です。","jpAnno":"快晴(かいせい)の日(ひ)に富士山(ふじさん)を見(み)ると、とても雄大(ゆうだい)です。","ko":"맑게 갠 날에 후지산을 보면, 매우 웅장합니다.","category":"건강·날씨·자연"},{"jp":"体力をつけるために、週3回以上運動するようにしています。","jpAnno":"体力(たいりょく)をつけるために、週(しゅう)3回(かい)以上(いじょう)運動(うんどう)するようにしています。","ko":"체력을 기르기 위해, 주 3회 이상 운동하도록 하고 있습니다.","category":"건강·날씨·자연"},{"jp":"今朝は霜が降りて、車のフロントガラスが凍っていました。","jpAnno":"今朝(けさ)は霜(しも)が降(お)りて、車(くるま)のフロントガラスが凍(こお)っていました。","ko":"오늘 아침은 서리가 내려서, 차 앞유리가 얼어 있었습니다.","category":"건강·날씨·자연"},{"jp":"長時間パソコンを見ていると、目が疲れます。","jpAnno":"長(なが)時間(じかん)パソコンを見(み)ていると、目(め)が疲(つか)れます。","ko":"장시간 컴퓨터를 보고 있으면, 눈이 피로합니다.","category":"건강·날씨·자연"},{"jp":"夕立が来そうなので、急いで洗濯物を取り込みました。","jpAnno":"夕立(ゆうだち)が来(き)そうなので、急(いそ)いで洗濯物(せんたくもの)を取(と)り込(こ)みました。","ko":"소나기가 올 것 같아서, 서둘러 빨래를 거뒀습니다.","category":"건강·날씨·자연"},{"jp":"春先は寒暖差が激しくて、体調を崩しやすいです。","jpAnno":"春(はる)先(さき)は寒暖差(かんだんさ)が激(はげ)しくて、体調(たいちょう)を崩(くず)しやすいです。","ko":"봄철에는 온도 차가 심하여, 건강이 나빠지기 쉽습니다.","category":"건강·날씨·자연"},{"jp":"この薬は眠くなる副作用があるので、運転前には飲まないでください。","jpAnno":"この薬(くすり)は眠(ねむ)くなる副作用(ふくさよう)があるので、運転(うんてん)前(まえ)には飲(の)まないでください。","ko":"이 약은 졸리는 부작용이 있어서, 운전 전에는 드시지 마세요.","category":"건강·날씨·자연"},{"jp":"激しい運動の後は、しっかりストレッチをすることが大切です。","jpAnno":"激(はげ)しい運動(うんどう)の後(あと)は、しっかりストレッチをすることが大切(たいせつ)です。","ko":"격렬한 운동 후에는, 충분히 스트레칭을 하는 것이 중요합니다.","category":"건강·날씨·자연"},{"jp":"最近睡眠不足で、昼間も眠くなってしまいます。","jpAnno":"最近(さいきん)睡眠(すいみん)不足(ぶそく)で、昼間(ひるま)も眠(ねむ)くなってしまいます。","ko":"최근 수면 부족으로, 낮에도 졸려 버립니다.","category":"건강·날씨·자연"},{"jp":"食欲がなくて、今日は食べることができませんでした。","jpAnno":"食欲(しょくよく)がなくて、今日(きょう)は食(た)べることができませんでした。","ko":"식욕이 없어서, 오늘은 먹을 수 없었습니다.","category":"건강·날씨·자연"},{"jp":"健康のためには、バランスの良い食事と適度な運動が必要です。","jpAnno":"健康(けんこう)のためには、バランスの良(よ)い食事(しょくじ)と適度(てきど)な運動(うんどう)が必要(ひつよう)です。","ko":"건강을 위해서는, 균형 잡힌 식사와 적당한 운동이 필요합니다.","category":"건강·날씨·자연"},{"jp":"この公園は緑が多くて、一日中鳥の声が聞こえます。","jpAnno":"この公園(こうえん)は緑(みどり)が多(おお)くて、一日中(いちにちじゅう)鳥(とり)の声(こえ)が聞(き)こえます。","ko":"이 공원은 녹지가 많아서, 하루종일 새 소리가 들립니다.","category":"건강·날씨·자연"},{"jp":"朝早く起きて、清々しい朝の空気を吸いました。","jpAnno":"朝早(あさはや)く起(お)きて、清々(すがすが)しい朝(あさ)の空気(くうき)を吸(す)いました。","ko":"아침 일찍 일어나서, 상쾌한 아침 공기를 마셨습니다.","category":"건강·날씨·자연"},{"jp":"台風の影響で、電車が全線運休になりました。","jpAnno":"台風(たいふう)の影響(えいきょう)で、電車(でんしゃ)が全線(ぜんせん)運休(うんきゅう)になりました。","ko":"태풍의 영향으로, 전철이 전 노선 운행 중단됐습니다.","category":"건강·날씨·자연"},{"jp":"血圧が高くならないように、塩分を控えた食事をしています。","jpAnno":"血圧(けつあつ)が高(たか)くならないように、塩分(えんぶん)を控(ひか)えた食事(しょくじ)をしています。","ko":"혈압이 높아지지 않도록, 염분을 줄인 식사를 하고 있습니다.","category":"건강·날씨·자연"},{"jp":"毎年冬になると、スキーに行くのが楽しみです。","jpAnno":"毎年(まいとし)冬(ふゆ)になると、スキーに行(い)くのが楽(たの)しみです。","ko":"매년 겨울이 되면, 스키를 타러 가는 것이 즐겁습니다.","category":"건강·날씨·자연"},{"jp":"空が急に暗くなって、激しい雨が降ってきました。","jpAnno":"空(そら)が急(きゅう)に暗(くら)くなって、激(はげ)しい雨(あめ)が降(ふ)ってきました。","ko":"하늘이 갑자기 어두워져서, 격렬한 비가 내리기 시작했습니다.","category":"건강·날씨·자연"},{"jp":"この山は春になると、高山植物が美しく咲きます。","jpAnno":"この山(やま)は春(はる)になると、高山植物(こうざんしょくぶつ)が美(うつく)しく咲(さ)きます。","ko":"이 산은 봄이 되면, 고산 식물이 아름답게 핍니다.","category":"건강·날씨·자연"},{"jp":"今日は運動日和で、気持ちよく走れました。","jpAnno":"今日(きょう)は運動(うんどう)日和(びより)で、気持(きも)ちよく走(はし)れました。","ko":"오늘은 운동하기 좋은 날로, 기분 좋게 달릴 수 있었습니다.","category":"건강·날씨·자연"},{"jp":"夏の太陽の下で長時間いると、日焼けしてしまいます。","jpAnno":"夏(なつ)の太陽(たいよう)の下(した)で長時間(ちょうじかん)いると、日焼(ひや)けしてしまいます。","ko":"여름 태양 아래서 장시간 있으면, 햇볕에 타 버립니다.","category":"건강·날씨·자연"},{"jp":"冬は早く日が暮れるので、暗くなる前に帰るようにしています。","jpAnno":"冬(ふゆ)は早(はや)く日(ひ)が暮(く)れるので、暗(くら)くなる前(まえ)に帰(かえ)るようにしています。","ko":"겨울은 일찍 해가 져서, 어두워지기 전에 돌아오도록 하고 있습니다.","category":"건강·날씨·자연"},{"jp":"長い間病気で寝込んでいたので、回復してから体を動かすのが大変でした。","jpAnno":"長(なが)い間(あいだ)病気(びょうき)で寝込(ねこ)んでいたので、回復(かいふく)してから体(からだ)を動(うご)かすのが大変(たいへん)でした。","ko":"오랫동안 아파서 누워 있었어서, 회복하고 나서 몸을 움직이는 것이 힘들었습니다.","category":"건강·날씨·자연"},{"jp":"雨が降ってきたので、濡れないように急いで帰りました。","jpAnno":"雨(あめ)が降(ふ)ってきたので、濡(ぬ)れないように急(いそ)いで帰(かえ)りました。","ko":"비가 오기 시작해서, 젖지 않도록 서둘러 돌아갔습니다.","category":"건강·날씨·자연"},{"jp":"寒い冬でも、毎朝のジョギングを欠かしません。","jpAnno":"寒(さむ)い冬(ふゆ)でも、毎朝(まいあさ)のジョギングを欠(か)かしません。","ko":"추운 겨울에도, 매일 아침 조깅을 빠뜨리지 않습니다.","category":"건강·날씨·자연"},{"jp":"夜中に急に熱が出て、救急病院に行きました。","jpAnno":"夜中(よなか)に急(きゅう)に熱(ねつ)が出(で)て、救急(きゅうきゅう)病院(びょういん)に行(い)きました。","ko":"한밤중에 갑자기 열이 나서, 응급 병원에 갔습니다.","category":"건강·날씨·자연"},{"jp":"日本に来てから、書道に興味を持つようになりました。","jpAnno":"日本(にほん)に来(き)てから、書道(しょどう)に興味(きょうみ)を持(も)つようになりました。","ko":"일본에 온 후로, 서예에 관심을 갖게 됐습니다.","category":"취미·여행·문화"},{"jp":"週末には友だちとテニスをするのが楽しみです。","jpAnno":"週末(しゅうまつ)には友(とも)だちとテニスをするのが楽(たの)しみです。","ko":"주말에는 친구와 테니스를 하는 것이 즐겁습니다.","category":"취미·여행·문화"},{"jp":"旅行の計画を立てるのに、1週間もかかりました。","jpAnno":"旅行(りょこう)の計画(けいかく)を立(た)てるのに、1週間(しゅうかん)もかかりました。","ko":"여행 계획을 세우는 데, 1주일이나 걸렸습니다.","c <script>
(function(){
  const VOCAB = JSON.parse(document.getElementById('vocab-data').textContent);
  const SENT  = JSON.parse(document.getElementById('sentence-data').textContent);

  // ===== Annotation -> ruby HTML =====
  // Pattern: 漢字(かんじ) -> <ruby>漢字<rt>かんじ</rt></ruby>
  const RUBY_RE = /([一-龯々]+)\(([぀-ゟ]+)\)/g;
  function toRuby(s){
    return s.replace(RUBY_RE, (_, k, r) => `<ruby>${k}<rt>${r}</rt></ruby>`);
  }
  function stripAnno(s){
    return s.replace(RUBY_RE, (_, k) => k);
  }
  function escapeHtml(s){
    return s.replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
  }
  // Render: escape first, then ruby (the ruby pattern only matches kanji+hiragana, not html chars)
  function render(s){ return toRuby(escapeHtml(s)); }
  function renderPlain(s){ return escapeHtml(stripAnno(s)); }

  // ===== Theme =====
  const themeBtn = document.getElementById('themeToggle');
  const themeLabel = document.getElementById('themeLabel');
  const stored = localStorage.getItem('n4-theme');
  if (stored === 'dark') document.documentElement.classList.add('dark');
  function syncThemeLabel(){
    themeLabel.textContent = document.documentElement.classList.contains('dark') ? '라이트' : '다크';
  }
  syncThemeLabel();
  themeBtn.addEventListener('click', () => {
    document.documentElement.classList.toggle('dark');
    localStorage.setItem('n4-theme', document.documentElement.classList.contains('dark') ? 'dark' : 'light');
    syncThemeLabel();
  });

  // ===== Tabs =====
  const tabs = document.querySelectorAll('.tab');
  const views = { vocab: document.getElementById('view-vocab'), sentence: document.getElementById('view-sentence') };
  tabs.forEach(t => t.addEventListener('click', () => {
    tabs.forEach(x => x.classList.toggle('is-active', x === t));
    const v = t.dataset.view;
    Object.entries(views).forEach(([k, el]) => el.classList.toggle('hidden', k !== v));
  }));

  // ===== Tag taxonomies =====
  const POS_TAGS = ['명사','동사','い형용사','な형용사','부사','접속사','기타'];
  // Topical tags: derive from data, exclude POS
  const POS_SET = new Set(POS_TAGS);
  const topicSet = new Set();
  VOCAB.forEach(v => v.t.forEach(tag => { if (!POS_SET.has(tag)) topicSet.add(tag); }));
  const TOPIC_TAGS = Array.from(topicSet).sort();

  // Counts per tag for "전체"
  function countByTag(items){
    const m = new Map();
    items.forEach(v => v.t.forEach(t => m.set(t, (m.get(t)||0)+1)));
    return m;
  }
  const tagCounts = countByTag(VOCAB);

  // Active tag state — sets for fast lookup. "전체" = empty set.
  const activePos = new Set();
  const activeTopic = new Set();

  // ===== Render tag chips =====
  function renderTagChips(container, tags, activeSet, kind){
    container.innerHTML = '';
    // "전체" chip
    const all = document.createElement('button');
    all.className = 'tag' + (activeSet.size === 0 ? ' is-on' : '');
    all.dataset.tag = '__all__';
    all.innerHTML = `전체 <span class="tag-count">${VOCAB.length}</span>`;
    all.addEventListener('click', () => {
      activeSet.clear();
      renderTagChips(container, tags, activeSet, kind);
      renderVocab();
    });
    container.appendChild(all);
    tags.forEach(tag => {
      const btn = document.createElement('button');
      btn.className = 'tag' + (activeSet.has(tag) ? ' is-on' : '');
      btn.dataset.tag = tag;
      const cnt = tagCounts.get(tag) || 0;
      btn.innerHTML = `${tag} <span class="tag-count">${cnt}</span>`;
      btn.addEventListener('click', () => {
        if (activeSet.has(tag)) activeSet.delete(tag); else activeSet.add(tag);
        renderTagChips(container, tags, activeSet, kind);
        renderVocab();
      });
      container.appendChild(btn);
    });
  }

  // ===== Vocab render =====
  const vocabGrid = document.getElementById('vocabGrid');
  const vEmpty = document.getElementById('vEmpty');
  const vTotal = document.getElementById('vTotal');
  const vSummary = document.getElementById('vSummary');
  const vSearch = document.getElementById('vSearch');
  const vShowExample = document.getElementById('vShowExample');
  const vShowFurigana = document.getElementById('vShowFurigana');

  function vocabMatches(v, query){
    if (activePos.size > 0 && !v.t.some(t => activePos.has(t))) return false;
    if (activeTopic.size > 0 && !v.t.some(t => activeTopic.has(t))) return false;
    if (query){
      const q = query.toLowerCase();
      const hay = (stripAnno(v.w) + ' ' + v.r + ' ' + v.m + ' ' + v.p).toLowerCase();
      if (!hay.includes(q)) return false;
    }
    return true;
  }

  function renderVocab(){
    const q = vSearch.value.trim();
    const showFuri = vShowFurigana.checked;
    const showEx = vShowExample.checked;
    const filtered = VOCAB.filter(v => vocabMatches(v, q));

    // Summary chips for active filters
    vSummary.innerHTML = '';
    [['품사', activePos], ['주제', activeTopic]].forEach(([label, set]) => {
      Array.from(set).forEach(tag => {
        const pill = document.createElement('span');
        pill.className = 'summary-pill';
        pill.innerHTML = `${tag} <button title="제거" data-tag="${tag}" data-kind="${label}">✕</button>`;
        pill.querySelector('button').addEventListener('click', () => {
          (label === '품사' ? activePos : activeTopic).delete(tag);
          renderTagChips(document.getElementById('tagList-pos'), POS_TAGS, activePos, 'pos');
          renderTagChips(document.getElementById('tagList-topic'), TOPIC_TAGS, activeTopic, 'topic');
          renderVocab();
        });
        vSummary.appendChild(pill);
      });
    });
    if (q){
      const pill = document.createElement('span');
      pill.className = 'summary-pill';
      pill.innerHTML = `검색: ${escapeHtml(q)} <button title="제거">✕</button>`;
      pill.querySelector('button').addEventListener('click', () => { vSearch.value=''; renderVocab(); });
      vSummary.appendChild(pill);
    }

    vTotal.textContent = filtered.length;
    if (filtered.length === 0){
      vocabGrid.innerHTML = '';
      vEmpty.classList.remove('hidden');
      return;
    }
    vEmpty.classList.add('hidden');

    const html = [];
    for (const v of filtered){
      const wHtml = showFuri ? render(v.w) : renderPlain(v.w);
      const exHtml = showFuri ? render(v.ex) : renderPlain(v.ex);
      const tags = v.t.map(t => {
        const isPos = POS_SET.has(t);
        return `<span class="tag-mini${isPos ? ' pos' : ''}">${escapeHtml(t)}</span>`;
      }).join('');
      html.push(`
        <article class="card">
          <div class="card-row">
            <div class="word">${wHtml}</div>
            <div class="reading">${escapeHtml(v.r)}</div>
          </div>
          <p class="meaning">${escapeHtml(v.m)}</p>
          ${showEx ? `<p class="example">${exHtml}<span class="ko">${escapeHtml(v.exm)}</span></p>` : ''}
          <div class="tags">${tags}</div>
        </article>`);
    }
    vocabGrid.innerHTML = html.join('');
  }

  // ===== Sentence render =====
  const sentenceList = document.getElementById('sentenceList');
  const sShowFurigana = document.getElementById('sShowFurigana');
  const sShowKo = document.getElementById('sShowKo');
  const sShuffle = document.getElementById('sShuffle');
  const sSummary = document.getElementById('sSummary');
  const sCountList = document.getElementById('sCountList');

  // Display count chip values
  const COUNT_OPTIONS = [50, 100, 200, 300, 502];
  let displayCount = 200;
  function renderCountChips(){
    sCountList.innerHTML = '';
    COUNT_OPTIONS.forEach(n => {
      const btn = document.createElement('button');
      btn.className = 'tag' + (n === displayCount ? ' is-on' : '');
      const label = n >= SENT.length ? '전체' : `${n}개`;
      btn.innerHTML = `${label} <span class="tag-count">${Math.min(n, SENT.length)}</span>`;
      btn.addEventListener('click', () => { displayCount = n; renderCountChips(); renderSentences(false); });
      sCountList.appendChild(btn);
    });
  }

  let order = SENT.map((_, i) => i);
  function shuffle(){
    for (let i = order.length - 1; i > 0; i--){
      const j = Math.floor(Math.random() * (i + 1));
      [order[i], order[j]] = [order[j], order[i]];
    }
  }

  function renderSentences(reshuffle){
    if (reshuffle) shuffle();
    const showFuri = sShowFurigana.checked;
    const showKo = sShowKo.checked;
    const limit = Math.min(displayCount, SENT.length);
    const items = order.slice(0, limit);

    sSummary.innerHTML = `<span class="summary-pill">${items.length} / ${SENT.length} 문장</span>`;

    const html = [];
    items.forEach((idx, i) => {
      const s = SENT[idx];
      const jp = showFuri ? render(s.jpAnno) : renderPlain(s.jpAnno);
      html.push(`
        <article class="s-card">
          <span class="s-num">${i+1}</span>
          <p class="s-jp">${jp}</p>
          ${showKo ? `<p class="s-ko">${escapeHtml(s.ko)}</p>` : ''}
          <div class="s-meta">
            <span class="tag-mini">${escapeHtml(s.category)}</span>
          </div>
        </article>`);
    });
    sentenceList.innerHTML = html.join('');
  }

  // ===== Wire up =====
  renderTagChips(document.getElementById('tagList-pos'), POS_TAGS, activePos, 'pos');
  renderTagChips(document.getElementById('tagList-topic'), TOPIC_TAGS, activeTopic, 'topic');
  vSearch.addEventListener('input', renderVocab);
  vShowExample.addEventListener('change', renderVocab);
  vShowFurigana.addEventListener('change', renderVocab);
  renderVocab();

  renderCountChips();
  sShowFurigana.addEventListener('change', () => renderSentences(false));
  sShowKo.addEventListener('change', () => renderSentences(false));
  sShuffle.addEventListener('click', () => renderSentences(true));
  renderSentences(true);
})();
</script>
</body>
</html>
